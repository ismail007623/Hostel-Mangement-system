[project]
name = "taqwa-hostel-backend"
version = "0.2.0"
description = "Taqwa Boys Hostel backend — FastAPI + SQLAlchemy + Pydantic v2 (Phase 2: rent cycles, payments, edit profile)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "SQLAlchemy==2.0.36",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "PyJWT==2.10.1",
    "bcrypt==4.2.1",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "alembic==1.14.1",
    "asyncpg>=0.32.0",
    "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
